<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">oWinnieo — little worlds for humans and agents</title>
  <desc id="desc">A midnight pixel-inspired banner with a small AI companion, stars, and glowing interface elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1021" />
      <stop offset="0.48" stop-color="#15152d" />
      <stop offset="1" stop-color="#21143a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8bd5ff" stop-opacity=".34" />
      <stop offset="1" stop-color="#8bd5ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bd5ff" />
      <stop offset=".52" stop-color="#c8b6ff" />
      <stop offset="1" stop-color="#ff8ec7" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d9e7ff" stroke-opacity=".045" />
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)" />
  <rect width="1200" height="320" rx="24" fill="url(#grid)" />
  <ellipse cx="602" cy="146" rx="395" ry="225" fill="url(#glow)" />

  <g fill="#d9e7ff">
    <rect x="58" y="54" width="3" height="3" opacity=".75" />
    <rect x="112" y="105" width="2" height="2" opacity=".45" />
    <rect x="190" y="39" width="4" height="4" opacity=".55" />
    <rect x="288" y="77" width="2" height="2" opacity=".75" />
    <rect x="949" y="48" width="3" height="3" opacity=".55" />
    <rect x="1082" y="88" width="4" height="4" opacity=".7" />
    <rect x="1141" y="44" width="2" height="2" opacity=".5" />
    <rect x="1027" y="239" width="3" height="3" opacity=".6" />
    <rect x="78" y="250" width="4" height="4" opacity=".55" />
  </g>

  <g transform="translate(126 89)">
    <circle cx="58" cy="66" r="70" fill="#8bd5ff" opacity=".08" />
    <path d="M58 10V-3M50-7h16" stroke="#c8b6ff" stroke-width="4" stroke-linecap="round" />
    <rect x="17" y="14" width="82" height="62" rx="18" fill="#171a32" stroke="#8bd5ff" stroke-width="3" />
    <rect x="29" y="26" width="58" height="37" rx="11" fill="#0b1021" />
    <circle cx="47" cy="44" r="6" fill="#8bd5ff" filter="url(#tinyGlow)" />
    <circle cx="70" cy="44" r="6" fill="#ff8ec7" filter="url(#tinyGlow)" />
    <path d="M46 57c8 7 17 7 25 0" fill="none" stroke="#c8b6ff" stroke-width="3" stroke-linecap="round" />
    <path d="M32 77h52l13 48H19z" fill="#171a32" stroke="#c8b6ff" stroke-width="3" stroke-linejoin="round" />
    <path d="M7 91h15M94 91h15M38 126l-7 18M78 126l7 18" stroke="#8bd5ff" stroke-width="5" stroke-linecap="round" />
    <rect x="42" y="91" width="33" height="10" rx="5" fill="url(#word)" opacity=".9" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="350" y="112" fill="#a9b7d4" font-size="17" letter-spacing="5">HELLO, WORLD — I AM</text>
    <text x="350" y="190" fill="url(#word)" font-size="72" font-weight="700" letter-spacing="3" filter="url(#softGlow)">oWinnieo</text>
    <text x="350" y="231" fill="#d9e7ff" font-size="16" letter-spacing="3">BUILDING LITTLE WORLDS FOR HUMANS + AGENTS</text>
  </g>

  <g transform="translate(1004 82)">
    <rect x="0" y="0" width="118" height="150" rx="10" fill="#0b1021" stroke="#524c78" stroke-width="2" />
    <rect x="12" y="14" width="94" height="100" rx="4" fill="#12172d" stroke="#8bd5ff" stroke-opacity=".45" />
    <circle cx="59" cy="64" r="26" fill="#c8b6ff" opacity=".09" />
    <path d="M35 72c8-24 40-24 48 0M42 73h34v28H42z" fill="none" stroke="#ff8ec7" stroke-width="3" />
    <circle cx="49" cy="63" r="3" fill="#8bd5ff" />
    <circle cx="69" cy="63" r="3" fill="#8bd5ff" />
    <path d="M16 128h44" stroke="#8bd5ff" stroke-width="3" />
    <path d="M16 138h71" stroke="#c8b6ff" stroke-width="3" opacity=".7" />
  </g>

  <path d="M0 281h1200" stroke="url(#word)" stroke-opacity=".42" />
  <text x="300" y="301" fill="#8f9ab8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="4">AI AGENTS  •  INTERACTIVE WORLDS  •  PLAYFUL SYSTEMS</text>
</svg>
