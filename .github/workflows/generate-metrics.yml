name: Refresh profile metrics

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-metrics.yml"
      - "scripts/generate-contribution-index.mjs"
      - "assets/heatmap/**"

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate the main Metrics artwork
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, metadata
          config_timezone: Asia/Singapore
          config_display: large
          config_animations: yes
          config_order: isocalendar, languages, activity, repositories
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 0
          plugin_activity_visibility: public
          plugin_activity_filter: push, pr, issue, review, fork, release
          plugin_repositories: yes
          plugin_repositories_featured: >-
            oWinnieo/oc-kindergarten,
            oWinnieo/dual-sub-video,
            oWinnieo/piano,
            oWinnieo/Anchor
          plugin_repositories_forks: yes
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #21262d;
              --color-calendar-graph-day-L1-bg: #2d4b73;
              --color-calendar-graph-day-L2-bg: #5865a8;
              --color-calendar-graph-day-L3-bg: #9b72cf;
              --color-calendar-graph-day-L4-bg: #e06fae;
            }
            h1, h2, h3, .repository .name span:first-child, .blue {
              color: #8bd5ff !important;
            }
            .field svg {
              fill: #a98cff;
            }

      - name: Check out the refreshed default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate the clickable fork-aware contribution index
        run: node scripts/generate-contribution-index.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          CONTRIBUTION_WEEKS: 16

      - name: Publish README index updates
        run: |
          if git diff --quiet -- README.md README.en.md README.ja.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md README.ja.md
          git commit -m "chore: refresh fork-aware contribution index"
          git push
