name: Refresh profile metrics

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-metrics.yml"
      - "scripts/**"
      - "assets/heatmap/**"

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate the main Metrics artwork
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, metadata
          config_timezone: Asia/Singapore
          config_display: large
          config_animations: yes
          config_order: languages, repositories
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_repositories: yes
          plugin_repositories_featured: >-
            oWinnieo/oc-kindergarten,
            oWinnieo/dual-sub-video,
            oWinnieo/piano,
            oWinnieo/Anchor
          plugin_repositories_forks: yes
          extras_css: |
            h1, h2, h3, .repository .name span:first-child, .blue {
              color: #8bd5ff !important;
            }
            .field svg {
              fill: #a98cff;
            }

      - name: Generate the compact contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Singapore
          config_display: regular
          config_animations: yes
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #ebedf0;
              --color-calendar-graph-day-L1-bg: #9be9a8;
              --color-calendar-graph-day-L2-bg: #40c463;
              --color-calendar-graph-day-L3-bg: #30a14e;
              --color-calendar-graph-day-L4-bg: #216e39;
            }

      - name: Check out the refreshed default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Show the latest update time for featured repositories
        run: node scripts/update-featured-repositories.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate the clickable fork-aware contribution index
        run: node scripts/generate-contribution-index.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          CONTRIBUTION_WEEKS: 8

      - name: Publish profile updates
        run: |
          if git diff --quiet -- README.md README.en.md README.ja.md github-metrics.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md README.ja.md github-metrics.svg
          git commit -m "chore: refresh profile metrics metadata"
          git push
